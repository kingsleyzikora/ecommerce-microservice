apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-service
  namespace: order-service
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.bigdawgboss.online
      secretName: order-service-tls
  rules:
    - host: api.bigdawgboss.online
      http:
        paths:
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 8080
