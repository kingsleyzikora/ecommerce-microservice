apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: cart-service
  labels:
    app: cart-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      containers:
        - name: cart-service
          image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/cart-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: cart-service-config
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
