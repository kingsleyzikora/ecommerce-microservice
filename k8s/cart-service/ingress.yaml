apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cart-service
  namespace: cart-service
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.yourdomain.com
      secretName: cart-service-tls
  rules:
    - host: api.yourdomain.com
      http:
        paths:
          - path: /api/cart
            pathType: Prefix
            backend:
              service:
                name: cart-service
                port:
                  number: 8080
