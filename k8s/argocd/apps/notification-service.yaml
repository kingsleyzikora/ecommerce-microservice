apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notification-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_WITH_YOUR_GH_ORG/micro-service-handson.git
    targetRevision: main
    path: k8s/notification-service
  destination:
    server: https://kubernetes.default.svc
    namespace: notification-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
